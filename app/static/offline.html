<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>{{ _('أنت غير متصل — أزاد') }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
<style nonce="{{ g.csp_nonce }}">
  /* Offline-capable page: must render with zero external asset deps.
     Tokens mirror pure-pages.css; kept minimal and self-contained because
     the app CSS may itself be unreachable while offline. */
  :root{
    --bg:#f8fafc;--text:#0f172a;--muted:#475569;
    --azad-gradient:linear-gradient(135deg,#0f766e 0%,#0e7490 100%);
    --radius-full:9999px;
  }
  html[data-theme="dark"]{
    --bg:#0f172a;--text:#f8fafc;--muted:#cbd5e1;
  }
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    min-height:100vh;font-family:"Cairo","Tajawal",sans-serif;
    background:var(--bg);color:var(--text);text-align:center;padding:2rem;
  }
  .box{max-width:400px;}
  h1{
    font-size:2rem;margin-bottom:1rem;font-weight:800;
    background:var(--azad-gradient);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;
  }
  p{color:var(--muted);margin-bottom:1.5rem;line-height:1.6;}
  .icon-big{font-size:4rem;margin-bottom:1rem;line-height:1;}
  .btn{
    display:inline-block;padding:.7rem 1.5rem;
    background:var(--azad-gradient);color:#fff;border-radius:var(--radius-full);
    text-decoration:none;font-weight:600;border:none;cursor:pointer;
    font-size:1rem;font-family:inherit;transition:filter .2s;
  }
  .btn:hover{filter:brightness(1.1);}
  .hint{margin-top:2rem;font-size:.8rem;color:var(--muted);}
</style>
</head>
<body>
<div class="box">
  <div class="icon-big">{{ icon('wifi-off') }}</div>
  <h1 class="pure-page__title">{{ _('أنت غير متصل بالإنترنت') }}</h1>
  <p class="pure-page__note">{{ _('يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى.') }}</p>
  <button class="pure-btn" data-reload aria-label="{{ _('إعادة المحاولة') }}">{{ _('إعادة المحاولة') }}</button>
  <p class="pure-note">{{ _('يمكنك مشاهدة المحتوى المخزّن مسبقاً بدون إنترنت.') }}</p>
</div>
<script nonce="{{ g.csp_nonce }}">
  document.addEventListener("click", function (e) {
    const target = e.target.closest("[data-reload]");
    if (target) location.reload();
  });
</script>
</body>
</html>

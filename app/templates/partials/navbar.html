<nav class="navbar">
  <div class="container">
    <a class="brand" href="{{ url_for('main.index') }}">
      <img src="{{ url_for('static', filename='img/azad-mark.svg') }}" alt="{{ _('شعار أزاد') }}">
      <span>{{ _('مدرسة أزاد الإلكترونية') }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="{{ _('القائمة') }}" aria-expanded="false" data-nav-toggle>
      ☰
    </button>
    <div class="nav-links" data-nav-links>
      <a href="{{ url_for('main.index') }}">{{ _('الرئيسية') }}</a>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('auth.dashboard') }}">{{ _('لوحتي') }}</a>
        <form method="post" action="{{ url_for('auth.logout') }}" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="azad-btn-outline" style="padding:.35rem 1rem">{{ _('خروج') }}</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}" class="azad-btn-outline" style="padding:.35rem 1rem">{{ _('دخول') }}</a>
        <a href="{{ url_for('auth.register') }}" class="azad-btn" style="padding:.35rem 1rem">{{ _('سجّل مجاناً') }}</a>
      {% endif %}
      <form method="post" action="{{ url_for('main.set_locale', lang='en' if current_locale != 'en' else 'ar') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="azad-btn-outline" style="padding:.35rem 1rem">{{ _('English') if current_locale == 'ar' else 'عربي' }}</button>
      </form>
    </div>
  </div>
</nav>

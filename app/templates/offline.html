<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#014e7c">
<title>{{ _('أنت غير متصل — أزاد') }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:"Cairo",sans-serif;background:var(--bg);color:var(--text);text-align:center;padding:2rem;}
.box{max-width:400px;}
h1{font-size:2rem;margin-bottom:1rem;background:var(--azad-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
p{color:var(--muted);margin-bottom:1.5rem;line-height:1.6;}
.icon-big{font-size:4rem;margin-bottom:1rem;}
.btn{display:inline-block;padding:.7rem 1.5rem;background:var(--azad-gradient);color:#fff;border-radius:var(--radius-full);text-decoration:none;font-weight:600;border:none;cursor:pointer;font-size:1rem;font-family:inherit;}
.btn:hover{filter:brightness(1.1);}
</style>
</head>
<body>
<div class="box">
<div class="icon-big">📡</div>
<h1>{{ _('أنت غير متصل بالإنترنت') }}</h1>
<p>{{ _('يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى.') }}</p>
<button class="btn" onclick="location.reload()">{{ _('إعادة المحاولة') }}</button>
<p style="margin-top:2rem;font-size:.8rem;color:var(--text-muted)">{{ _('يمكنك مشاهدة المحتوى المخزّن مسبقاً بدون إنترنت.') }}</p>
</div>
</body>
</html>

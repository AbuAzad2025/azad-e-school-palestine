services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ../instance:/app/instance
      - ../backups:/app/backups
      - ../app/static/uploads:/app/app/static/uploads
    depends_on:
      - db
      - redis
    networks:
      - azad

  # AZ-P1-10: الجدولة الحقيقية — cron داخل نفس الصورة (نفس الكود ونفس .env)
  # يقرأ deploy/crontab، وكل مهمة تستدعي scripts/scheduled_jobs.sh. كان ملف
  # النشر بلا أي جدولة، والمهام الوحيدة المكتوبة كانت في crontab المضيف.
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["cron", "-f", "-l", "2"]
    env_file:
      - ../.env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - APP_DIR=/app
    volumes:
      - ../instance:/app/instance
      - ../backups:/app/backups
      - ../deploy/crontab:/etc/cron.d/azad:ro
    depends_on:
      - db
      - redis
    networks:
      - azad

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backups:/backups
    networks:
      - azad

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - azad

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app/static:/var/www/static:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - azad

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - ../app/static:/var/www/certbot:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - azad

volumes:
  postgres_data:
  redis_data:
  certbot_data:

networks:
  azad:
    driver: bridge
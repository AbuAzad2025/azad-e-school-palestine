name: Backup Restore Verification

on:
  schedule:
    - cron: "0 3 * * 0"  # Weekly Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      s3_key:
        description: "S3 key of backup to test (default: latest)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write  # For OIDC AWS auth

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
  BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
  BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
  BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: "us-east-1"

jobs:
  restore-verify:
    name: Restore & Verify Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary boto3

      - name: Configure AWS credentials
        if: env.BACKUP_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Run restore verification (local backup)
        if: env.BACKUP_S3_BUCKET == ''
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Find latest local backup
          LATEST=$(ls -t backups/backup_*.sql.gz 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "No local backup found, skipping"
            exit 0
          fi
          python scripts/restore_verify.py --backup-path "$LATEST" --db-url "$DATABASE_URL"

      - name: Run restore verification (S3 backup)
        if: env.BACKUP_S3_BUCKET != ''
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Determine which backup to test
          if [ -n "${{ github.event.inputs.s3_key }}" ]; then
            S3_KEY="${{ github.event.inputs.s3_key }}"
          else
            # Find latest backup in S3
            S3_KEY=$(aws s3 ls "s3://${BACKUP_S3_BUCKET}/backups/" --endpoint-url "${BACKUP_S3_ENDPOINT}" \
              | grep "backup_" | sort | tail -1 | awk '{print $4}')
            S3_KEY="backups/${S3_KEY}"
          fi

          if [ -z "$S3_KEY" ]; then
            echo "No backup found in S3, skipping"
            exit 0
          fi

          echo "Testing backup: s3://${BACKUP_S3_BUCKET}/${S3_KEY}"
          python scripts/restore_verify.py \
            --s3-bucket "${BACKUP_S3_BUCKET}" \
            --s3-key "${S3_KEY}" \
            --db-url "${DATABASE_URL}"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: restore-verification-report
          path: |
            restore_report.txt
            restore_report.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

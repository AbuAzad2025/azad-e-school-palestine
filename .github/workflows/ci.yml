name: CI

# مثبّت على ubuntu-24.04: التسمية ubuntu-latest تنتقل تدريجياً (وعشوائياً) إلى Ubuntu 26.04
# بين 19/10 و19/11/2026 (actions/runner-images#14748) — نثبّت لضمان حتمية CI وننتقل لاحقاً بقرار مدروس.

on:
  push:
    branches: [main]
    # لا تعيد تشغيل الأنابيب الكاملة لتغييرات الوثائق/التقارير فقط
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.txt"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.txt"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. Lint + Security
  # ════════════════════════════════════════════════════════════
  lint:
    name: Lint & Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/*.py') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy bandit pip-audit
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      # ── Python ──
      - name: Ruff check
        run: ruff check app config.py run.py --output-format github

      - name: Ruff format
        run: ruff format --check app config.py run.py

      - name: MyPy
        run: mypy app config.py run.py --ignore-missing-imports --no-error-summary

      # ── JS ──
      - name: Biome check
        run: npx biome check app/static/js

      # ── i18n ──
      - name: Translation catalogs check
        run: python scripts/dump_untranslated.py

      # ── Security ──
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pip-audit
        run: python -m pip_audit -r requirements.txt --desc on

      - name: Bandit
        run: bandit -r app -q -ll

      - name: Hadolint
        if: hashFiles('Dockerfile') != ''
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  # ════════════════════════════════════════════════════════════
  # 1b. Frontend Asset Quality (templates + static, no DB needed)
  # ════════════════════════════════════════════════════════════
  frontend-asset-quality:
    name: Frontend Asset Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Pure filesystem/Jinja checks: asset existence, duplicate imports,
      # orphans, block integrity, WCAG static rules, JS patterns.
      - name: Run asset + template quality tests
        env:
          PYTHONPATH: .
          SECRET_KEY: ci-asset-quality-key
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg2://azad_test:azad_test@localhost:5432/azad_test
          FLASK_APP: run.py
        run: |
          pytest tests/test_css_architecture.py tests/test_wcag_aa.py \
            tests/test_frontend_critical.py -v --tb=short

  # ════════════════════════════════════════════════════════════
  # 2. Python Tests
  # ════════════════════════════════════════════════════════════
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov pytest-html

      - name: Make the app role subject to RLS
        # The container's POSTGRES_USER is a superuser, and a superuser
        # bypasses row-level security no matter what the policies say. Left
        # that way, every test asserting a cross-tenant query is *blocked*
        # passes while the database is showing everything — the exact gap the
        # RLS rollout exists to close would be invisible to CI.
        #
        # The role cannot simply be demoted: PostgreSQL refuses to clear
        # SUPERUSER from the bootstrap user ("The bootstrap user must have the
        # SUPERUSER attribute"), and the stock `postgres` role has no password
        # once POSTGRES_USER is overridden. So the suite runs as a separate
        # role that owns the schema but is neither a superuser nor BYPASSRLS.
        #
        # It must be created *before* the migrations so it owns every table
        # they create — no follow-up GRANT needed, and nothing to forget.
        # CREATEROLE is kept because tests/unit/test_core_security_gaps.py
        # provisions its own minimal `rls_probe` login. citext is a trusted
        # extension since PG13, so migrations work without superuser.
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="localhost", user="azad_test", password="azad_test", dbname="azad_test"
          )
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP ROLE IF EXISTS azad_app")
              cur.execute(
                  "CREATE ROLE azad_app LOGIN PASSWORD 'azad_app' "
                  "NOSUPERUSER NOBYPASSRLS CREATEROLE"
              )
              cur.execute("GRANT CONNECT ON DATABASE azad_test TO azad_app")
              # CREATE on the *database*, not just the schema: creating a
              # trusted extension such as citext (PG13+ needs no superuser,
              # but still a privilege) is checked at the database level, and
              # without this `flask db upgrade` dies on the very first
              # migration with "permission denied to create extension citext".
              cur.execute("GRANT CREATE ON DATABASE azad_test TO azad_app")
              cur.execute("ALTER SCHEMA public OWNER TO azad_app")
          conn.close()
          print("created azad_app: owns the schema, cannot bypass RLS")
          PY

      - name: Run migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_app:azad_app@localhost:5432/azad_test
          SECRET_KEY: ci-test-key
          FLASK_APP: run.py
          TALISMAN_ENABLED: "0"
        run: flask db upgrade

      - name: Verify RLS is actually enforced
        # Asserts the premise the tests below depend on: the role cannot bypass
        # RLS, and every table the rollout claims to cover is both protected and
        # has a policy. If this ever passes on a bypassing role, the isolation
        # tests below are vacuous and are reporting nothing.
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_app:azad_app@localhost:5432/azad_test
          SECRET_KEY: ci-test-key
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          expected = {
              "announcements", "assignments", "attendance", "audit_logs",
              "class_members", "grade_items", "lessons", "manual_payments",
              "offline_downloads", "payment_receipts", "student_progress",
              "subscriptions", "units", "user_role_links", "video_progress",
              "wallets", "wallet_transactions",
          }
          with engine.connect() as conn:
              is_super, bypass = conn.execute(
                  text("SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user")
              ).one()
              assert not is_super, "test role is a superuser: RLS is not enforced"
              assert not bypass, "test role has BYPASSRLS: RLS is not enforced"
              protected = {
                  row[0]
                  for row in conn.execute(
                      text(
                          "SELECT c.relname FROM pg_class c "
                          "JOIN pg_namespace n ON n.oid = c.relnamespace "
                          "WHERE n.nspname = 'public' AND c.relrowsecurity"
                      )
                  )
              }
              with_policy = {
                  row[0]
                  for row in conn.execute(
                      text("SELECT tablename FROM pg_policies WHERE schemaname = 'public'")
                  )
              }
          assert not (expected - protected), f"RLS not enabled on {sorted(expected - protected)}"
          assert not (expected - with_policy), f"no policy on {sorted(expected - with_policy)}"
          print(f"RLS enforced on {len(protected)} tables; all {len(expected)} rollout targets covered")
          PY

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_app:azad_app@localhost:5432/azad_test
          SECRET_KEY: ci-test-key-not-for-production
          FLASK_APP: run.py
          TALISMAN_FORCE_HTTPS: "0"
          TALISMAN_ENABLED: "0"
          SESSION_COOKIE_SECURE: "0"
          APP_ENV: testing
          DEBUG: "true"
        run: |
          pytest tests -v --tb=short \
            --cov=app --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --deselect tests/test_erp_ux_sprint4.py \
            --deselect tests/test_openapi.py \
            --deselect tests/test_offline_client.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # 3. JS Tests
  # ════════════════════════════════════════════════════════════
  test-js:
    name: JS Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
      - run: npx vitest run --coverage

      - name: Upload JS coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-js
          path: coverage/js/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # 4. E2E Tests
  # ════════════════════════════════════════════════════════════
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Playwright
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      - name: Make the app role subject to RLS
        # Same reason as the `test` job: the container's POSTGRES_USER is a
        # superuser, so without this the E2E suite runs against a database that
        # ignores the policies it is meant to exercise end to end. Created
        # before the migrations so it owns everything they build.
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="localhost", user="azad_test", password="azad_test", dbname="azad_test"
          )
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP ROLE IF EXISTS azad_app")
              cur.execute(
                  "CREATE ROLE azad_app LOGIN PASSWORD 'azad_app' "
                  "NOSUPERUSER NOBYPASSRLS CREATEROLE"
              )
              cur.execute("GRANT CONNECT ON DATABASE azad_test TO azad_app")
              # CREATE on the database is what lets the migrations install
              # citext; schema ownership alone is not enough for it.
              cur.execute("GRANT CREATE ON DATABASE azad_test TO azad_app")
              cur.execute("ALTER SCHEMA public OWNER TO azad_app")
          conn.close()
          print("created azad_app: owns the schema, cannot bypass RLS")
          PY

      - name: Run migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_app:azad_app@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          TALISMAN_ENABLED: "0"
        run: flask db upgrade

      - name: Set E2E credentials
        # D4: no secret lives in the repository. The E2E job mints its own
        # throwaway credentials and shares them through GITHUB_ENV, so the seed
        # script, the app Playwright starts, and the specs all agree.
        run: |
          echo "E2E_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(18))')" >> "$GITHUB_ENV"
          echo "WHATSAPP_APP_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          echo "WHATSAPP_VERIFY_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"

      - name: Seed E2E fixtures
        # The suite asserts on real rows (a subscription, a mark, an attendance
        # row) instead of mocking them, so the database needs fixtures first.
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_app:azad_app@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          APP_ENV: testing
          TALISMAN_ENABLED: "0"
        run: python scripts/seed_e2e.py

      - name: Run E2E
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_app:azad_app@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          APP_ENV: testing
          TALISMAN_ENABLED: "0"
          SESSION_COOKIE_SECURE: "0"
          TESTING: "1"
          # CSRF stays on: Flask-WTF guards the JSON endpoints exactly as it
          # guards forms, and a webhook route that forgets its exemption fails
          # only when this is enabled.
          WTF_CSRF_ENABLED: "1"
          EMAIL_ENABLED: "0"
        run: npx playwright test --reporter=list

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-traces
          path: test-results
          retention-days: 3

  # ════════════════════════════════════════════════════════════
  # 5. Docker Build + Verify
  # ════════════════════════════════════════════════════════════
  build:
    name: Build & Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: flask db upgrade
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-key
          FLASK_APP: run.py
        run: flask db upgrade

      - name: flask db downgrade
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-key
          FLASK_APP: run.py
        run: flask db downgrade -- -1

      - name: Verify app boot
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-key
          FLASK_APP: run.py
          APP_ENV: testing
        run: |
          python -c "
          from app import create_app
          app = create_app()
          print(f'Routes: {len([r for r in app.url_map.iter_rules() if r.endpoint != \"static\"])}')
          print('App boot OK')
          "

      - name: Docker build
        run: |
          docker build -t azad-e-school:test .
          echo "Docker build OK"

  # ════════════════════════════════════════════════════════════
  # 6. Coverage Report
  # ════════════════════════════════════════════════════════════
  coverage:
    name: Coverage Report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test, test-js]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download backend coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage-backend
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-js
          path: coverage-frontend
        continue-on-error: true

      - name: Merge, report gaps & enforce ratchet
        id: merge
        env:
          COVERAGE_COMMENT_PATH: /tmp/coverage-comment.md
        run: |
          BACKEND_XML=$(find coverage-backend -name 'coverage.xml' -type f 2>/dev/null | head -1)
          FRONTEND_XML=$(find coverage-frontend -name 'cobertura-coverage.xml' -type f 2>/dev/null | head -1)
          BACKEND_XML="${BACKEND_XML:-coverage-backend/coverage.xml}"
          FRONTEND_XML="${FRONTEND_XML:-coverage-frontend/cobertura-coverage.xml}"

          EMPTY='<?xml version="1.0" ?>'
          EMPTY+='<coverage lines-valid="0" lines-covered="0" branches-valid="0" branches-covered="0" version="0.1">'
          EMPTY+='<packages></packages>'
          EMPTY+='</coverage>'

          if [ ! -f "$BACKEND_XML" ]; then
            mkdir -p "$(dirname "$BACKEND_XML")"
            echo "$EMPTY" > "$BACKEND_XML"
          fi
          if [ ! -f "$FRONTEND_XML" ]; then
            mkdir -p "$(dirname "$FRONTEND_XML")"
            echo "$EMPTY" > "$FRONTEND_XML"
          fi

          # Combined summary + per-file gap tables + monotonic fail-under gate
          python scripts/coverage_gaps.py "$BACKEND_XML" "$FRONTEND_XML" \
            --comment-file "$COVERAGE_COMMENT_PATH" --check

      - name: Post PR comment
        if: github.event_name == 'pull_request' && steps.merge.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage-comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Comment gap report on commit (push)
        if: github.event_name == 'push' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Automated per-file gap comment attached to the pushed commit —
          # visible on the commit page and re-posted on every CI run.
          BODY=$(jq -Rs . < /tmp/coverage-comment.md)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="${BODY}" 2>&1 | tail -1 || true

  # ════════════════════════════════════════════════════════════
  # 7. Deploy (main only)
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [test, test-js, test-e2e, build, coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/azad-e-school
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy — secrets not configured."
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/azad-e-school
            git pull origin main
            docker pull ghcr.io/${{ github.repository }}/azad-e-school:latest
            docker compose -f deploy/docker-compose.production.yml up -d --build
            docker compose -f deploy/docker-compose.production.yml exec -T app flask db upgrade
            docker compose -f deploy/docker-compose.production.yml exec -T app pybabel compile -d app/translations
            docker system prune -f

      - name: Smoke test
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          sleep 10
          curl -sf https://${{ secrets.DEPLOY_HOST }}/ || exit 1

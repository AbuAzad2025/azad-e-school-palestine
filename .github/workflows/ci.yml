name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ════════════════════════════════════════════════════════════
  # Static Quality: Python · JavaScript
  # ════════════════════════════════════════════════════════════
  lint-audit:
    name: Static quality (py · js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy bandit

      - name: Install Node lint tools
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      # ── Python ──
      - name: Ruff check (lint)
        run: ruff check app config.py run.py --output-format github

      - name: Ruff format (check)
        run: ruff format --check app config.py run.py

      - name: MyPy (types)
        run: mypy app config.py run.py --ignore-missing-imports --no-error-summary

      - name: Bandit security (Python)
        run: bandit -r app -q -ll

      # ── JavaScript ──
      - name: Biome check (JS lint + format)
        run: npx biome check app/static/js

  # ════════════════════════════════════════════════════════════
  # Security Scan: Secrets · Dependencies · Docker
  # ════════════════════════════════════════════════════════════
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit bandit

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pip-audit (dependency vulnerabilities)
        run: python -m pip_audit -r requirements.txt --desc on

      - name: Hadolint (Dockerfile lint)
        if: hashFiles('Dockerfile') != ''
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Bandit JSON report
        run: bandit -r app -f json -o bandit-report.json -ll

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # Tests (with PostgreSQL)
  # ════════════════════════════════════════════════════════════
  test:
    name: Tests (PG 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov pytest-html

      - name: Run tests with full coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-test-key-not-for-production
          FLASK_APP: run.py
          TALISMAN_FORCE_HTTPS: "0"
          TALISMAN_ENABLED: "0"
          SESSION_COOKIE_SECURE: "0"
          APP_ENV: testing
          DEBUG: "true"
        run: |
          pytest tests -v --tb=short \
            --cov=app --cov-branch --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --html=report.html --self-contained-html \
            -x 2>&1 || pytest tests --tb=short \
            --cov=app --cov-branch --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --html=report.html --self-contained-html

      - name: Test summary
        if: always()
        run: |
          python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          t = data['totals']
          print('')
          print('┌─────────────────────────────────────────────┐')
          print('│          FULL COVERAGE REPORT               │')
          print('├─────────────────────────────────────────────┤')
          print(f'│  Lines covered    : {t[\"covered_lines\"]:>6} / {t[\"num_statements\"]:<6}        │')
          print(f'│  Line coverage    : {t[\"percent_covered\"]:>6.2f}%                    │')
          print(f'│  Missing lines    : {t[\"missing_lines\"]:>6}                    │')
          print(f'│  Branches missing : {str(t.get(\"missing_branches\",\"?\")):>6}                    │')
          print(f'│  Functions covered: {t.get(\"covered_functions\",\"?\"):>6} / {t.get(\"num_functions\",\"?\"):<6}        │')
          print(f'│  Classes covered  : {t.get(\"covered_classes\",\"?\"):>6} / {t.get(\"num_classes\",\"?\"):<6}        │')
          print('└─────────────────────────────────────────────┘')
          "
          echo ""
          echo "Full HTML report: htmlcov/index.html"
          echo "Test report: report.html"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.html
            htmlcov/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml,./coverage.json
          flags: pytest
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 14

  # ════════════════════════════════════════════════════════════
  # Frontend JS Tests (Vitest + jsdom)
  # ════════════════════════════════════════════════════════════
  test-js:
    name: JS unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      - name: Run Vitest with coverage
        run: npx vitest run --coverage

      - name: Upload JS coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: coverage/js
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # E2E Tests (Playwright)
  # ════════════════════════════════════════════════════════════
  test-e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          TALISMAN_FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: flask db upgrade

      - name: Run Playwright E2E tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          APP_ENV: testing
          TALISMAN_FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: npx playwright test --reporter=list

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # App Boot Verification (smoke test)
  # ════════════════════════════════════════════════════════════
  verify-boot:
    name: Verify app boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app creates + routes load
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-test-key
          FLASK_APP: run.py
          APP_ENV: testing
        run: |
          python -c "
          from app import create_app
          app = create_app()
          with app.test_client() as c:
              for rule in app.url_map.iter_rules():
                  if rule.endpoint == 'static':
                      continue
                  print(f'  registered: {rule.rule} -> {rule.endpoint}')
          print('App boot OK — all routes registered')
          "

  # ════════════════════════════════════════════════════════════
  # Docker Build Check
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t azad-e-school:test .

      - name: Verify image starts
        run: |
          CONTAINER_ID=$(docker run -d --name test-azad \
            -e DATABASE_URL=postgresql://x:x@localhost:5432/x \
            -e SECRET_KEY=test-key \
            -e APP_ENV=testing \
            -e FLASK_APP=run.py \
            -p 5000:8000 \
            azad-e-school:test)
          sleep 8
          docker logs "$CONTAINER_ID" 2>&1 | tail -20
          docker inspect "$CONTAINER_ID" --format='{{.State.Status}}' | grep -q running
          echo "Docker container is running"
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"

  # ════════════════════════════════════════════════════════════
  # Migrations (flask db upgrade + downgrade)
  # ════════════════════════════════════════════════════════════
  migrations:
    name: Migrations (PG 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_migrate
          POSTGRES_PASSWORD: azad_migrate
          POSTGRES_DB: azad_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (upgrade)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_migrate:azad_migrate@localhost:5432/azad_migrate
          SECRET_KEY: ci-migration-key
          FLASK_APP: run.py
        run: flask db upgrade

      - name: Verify schema version
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_migrate:azad_migrate@localhost:5432/azad_migrate
          SECRET_KEY: ci-migration-key
          FLASK_APP: run.py
        run: |
          python -c "
          from sqlalchemy import text
          from app import create_app
          from app.extensions import db
          app = create_app()
          with app.app_context():
              result = db.session.execute(text('SELECT version_num FROM alembic_version')).fetchone()
              print(f'Current migration: {result[0] if result else \"NONE\"}')
          "

      - name: Run migrations (downgrade)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_migrate:azad_migrate@localhost:5432/azad_migrate
          SECRET_KEY: ci-migration-key
          FLASK_APP: run.py
        run: flask db downgrade -- -1

      - name: Verify downgrade
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_migrate:azad_migrate@localhost:5432/azad_migrate
          SECRET_KEY: ci-migration-key
          FLASK_APP: run.py
        run: |
          python -c "
          from sqlalchemy import text
          from app import create_app
          from app.extensions import db
          app = create_app()
          with app.app_context():
              result = db.session.execute(text('SELECT version_num FROM alembic_version')).fetchone()
              print(f'After downgrade: {result[0] if result else \"NONE\"}')
          "

  # ════════════════════════════════════════════════════════════
  # Summary (must pass for merge)
  # ════════════════════════════════════════════════════════════
  ci-passed:
    name: CI passed
    needs: [lint-audit, security-scan, test, test-js, test-e2e, verify-boot, docker-build, migrations]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "lint-audit:       ${{ needs.lint-audit.result }}"
          echo "security-scan:    ${{ needs.security-scan.result }}"
          echo "test:             ${{ needs.test.result }}"
          echo "test-js:          ${{ needs.test-js.result }}"
          echo "test-e2e:         ${{ needs.test-e2e.result }}"
          echo "verify-boot:      ${{ needs.verify-boot.result }}"
          echo "docker-build:     ${{ needs.docker-build.result }}"
          echo "migrations:       ${{ needs.migrations.result }}"

          FAILED=0
          for job in lint-audit security-scan test test-js test-e2e verify-boot docker-build migrations; do
            result="${{ needs[job].result }}"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::${job} failed or was cancelled"
              FAILED=1
            fi
          done
          if [[ "$FAILED" == "1" ]]; then
            exit 1
          fi
          echo "All 8 jobs passed!"

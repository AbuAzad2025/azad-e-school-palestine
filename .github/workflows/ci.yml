name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  COVERAGE_FAIL_UNDER: "85"

jobs:
  # ════════════════════════════════════════════════════════════
  # Static Quality: Python · JavaScript · CSS
  # ════════════════════════════════════════════════════════════
  lint-audit:
    name: Static quality (py · js · css)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy bandit

      - name: Install Node lint tools
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
          npx @biomejs/biome --version 2>/dev/null || npm install -g @biomejs/biome

      # ── Python ──
      - name: Ruff check (lint)
        run: ruff check app config.py run.py --output-format github

      - name: Ruff format (check)
        run: ruff format --check app config.py run.py

      - name: MyPy (types)
        run: mypy app config.py run.py --ignore-missing-imports --no-error-summary

      - name: Bandit security (Python)
        run: bandit -r app -q -ll

      # ── JavaScript ──
      - name: Biome check (JS lint + format)
        run: npx biome check app/static/js

      # ── CSS ──
      - name: CSS validation
        run: |
          echo "Checking CSS files exist and are non-empty"
          find app/static/css -name "*.css" -size +0c | head -5

  # ════════════════════════════════════════════════════════════
  # Security Scan: Secrets · Dependencies · Docker
  # ════════════════════════════════════════════════════════════
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: pip-audit (dependency vulnerabilities)
        run: python -m pip_audit -r requirements.txt --desc on
        continue-on-error: true

      - name: Hadolint (Dockerfile lint)
        if: always()
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

      - name: Bandit JSON report
        if: always()
        run: |
          pip install bandit
          bandit -r app -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # Tests (with PostgreSQL)
  # ════════════════════════════════════════════════════════════
  test:
    name: Tests (PG 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-test-key-not-for-production
          FLASK_APP: run.py
          TALISMAN_FORCE_HTTPS: "0"
          TALISMAN_ENABLED: "0"
          SESSION_COOKIE_SECURE: "0"
          APP_ENV: testing
          DEBUG: "true"
        run: |
          pytest tests -v --tb=short \
            --cov=app --cov-report=term \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: pytest
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # App Boot Verification (smoke test)
  # ════════════════════════════════════════════════════════════
  verify-boot:
    name: Verify app boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app creates successfully
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-test-key
          FLASK_APP: run.py
          APP_ENV: testing
        run: |
          python -c "from app import create_app; app = create_app(); print('App created OK')"

  # ════════════════════════════════════════════════════════════
  # Coverage Report (enforce floor)
  # ════════════════════════════════════════════════════════════
  coverage-report:
    name: Coverage report
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: Enforce coverage floor
        if: always()
        run: |
          pip install coverage
          coverage xml 2>/dev/null || true
          echo "Coverage report available at coverage.xml"

  # ════════════════════════════════════════════════════════════
  # Docker Build Check
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t azad-e-school:test .
          echo "Docker build successful"

      - name: Smoke test (image runs)
        run: |
          docker run -d --name test-azad \
            -e DATABASE_URL=sqlite:///tmp/test.db \
            -e SECRET_KEY=test-key \
            -e APP_ENV=testing \
            -p 5000:8000 \
            azad-e-school:test || true
          sleep 5
          docker logs test-azad 2>&1 | head -20
          docker stop test-azad || true
          docker rm test-azad || true

  # ════════════════════════════════════════════════════════════
  # Summary (must pass for merge)
  # ════════════════════════════════════════════════════════════
  ci-passed:
    name: CI passed
    needs: [lint-audit, security-scan, test, verify-boot, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "lint-audit:       ${{ needs.lint-audit.result }}"
          echo "security-scan:    ${{ needs.security-scan.result }}"
          echo "test:             ${{ needs.test.result }}"
          echo "verify-boot:      ${{ needs.verify-boot.result }}"
          echo "docker-build:     ${{ needs.docker-build.result }}"

          if [[ "${{ needs.lint-audit.result }}" == "failure" ]]; then
            echo "::error::Static quality checks failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [[ "${{ needs.verify-boot.result }}" == "failure" ]]; then
            echo "::error::App boot verification failed"
            exit 1
          fi
          echo "All required jobs passed!"

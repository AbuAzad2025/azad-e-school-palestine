name: CI + Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.svg"
      - "**.png"
      - "**.jpg"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. Lint + Security (merged into one job)
  # ════════════════════════════════════════════════════════════
  lint-security:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy bandit pip-audit

      - name: Install Node deps
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund

      # ── Python lint ──
      - name: Ruff check
        run: ruff check app config.py run.py --output-format github

      - name: Ruff format
        run: ruff format --check app config.py run.py

      - name: MyPy
        run: mypy app config.py run.py --ignore-missing-imports --no-error-summary

      # ── JS lint ──
      - name: Biome check
        run: npx biome check app/static/js

      # ── i18n: تفشل عند سلاسل غير مترجمة أو fuzzy في الكتالوجات ──
      - name: Translation catalogs check
        run: python scripts/dump_untranslated.py

      # ── Security ──
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pip-audit (vulns)
        run: python -m pip_audit -r requirements.txt --desc on

      - name: Bandit
        run: bandit -r app -q -ll

      - name: Hadolint (Dockerfile)
        if: hashFiles('Dockerfile') != ''
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # ════════════════════════════════════════════════════════════
  # 2. Tests (PG 16) — with migrations before tests!
  # ════════════════════════════════════════════════════════════
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-security
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov pytest-html

      # ── CRITICAL: run migrations before tests ──
      - name: Run migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-test-key
          FLASK_APP: run.py
          TALISMAN_ENABLED: "0"
        run: flask db upgrade

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-test-key-not-for-production
          FLASK_APP: run.py
          TALISMAN_FORCE_HTTPS: "0"
          TALISMAN_ENABLED: "0"
          SESSION_COOKIE_SECURE: "0"
          APP_ENV: testing
          DEBUG: "true"
        run: |
          pytest tests -v --tb=short \
            --cov=app --cov-branch --cov-fail-under=70 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
          echo "=== Coverage files ==="
          ls -la coverage.xml htmlcov/ 2>/dev/null || echo "(no coverage files generated)"

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 3

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # 3. JS Tests
  # ════════════════════════════════════════════════════════════
  test-js:
    name: JS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
      - run: npx vitest run --coverage

      - name: Upload JS coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage/js/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # 4. E2E Tests
  # ════════════════════════════════════════════════════════════
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-security, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Run migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          TALISMAN_ENABLED: "0"
        run: flask db upgrade
      - name: Run E2E
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-e2e-key
          FLASK_APP: run.py
          APP_ENV: testing
          TALISMAN_ENABLED: "0"
          SESSION_COOKIE_SECURE: "0"
          TESTING: "1"
          WTF_CSRF_ENABLED: "0"
          EMAIL_ENABLED: "0"
        run: npx playwright test --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results
          retention-days: 3

  # ════════════════════════════════════════════════════════════
  # 5. Docker Build + Boot + Migrations
  # ════════════════════════════════════════════════════════════
  build-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-security
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Migrations
      - name: flask db upgrade
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-key
          FLASK_APP: run.py
        run: flask db upgrade
      - name: flask db downgrade
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-key
          FLASK_APP: run.py
        run: flask db downgrade -- -1
      # Boot check
      - name: Verify app boot
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: ci-key
          FLASK_APP: run.py
          APP_ENV: testing
        run: |
          python -c "
          from app import create_app
          app = create_app()
          print(f'Routes: {len([r for r in app.url_map.iter_rules() if r.endpoint != \"static\"])}')
          print('App boot OK')
          "
      # Docker build
      - name: Docker build
        run: |
          docker build -t azad-e-school:test .
          echo "Docker build OK"

  # ════════════════════════════════════════════════════════════
  # 6. Unified Coverage Report
  # ════════════════════════════════════════════════════════════
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, test-js]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage-backend
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-js
          path: coverage-frontend
        continue-on-error: true

      - name: Merge & report coverage
        id: merge
        env:
          COVERAGE_COMMENT_PATH: /tmp/coverage-comment.md
        run: |
          echo "=== Debugging artifact structure ==="
          echo "--- coverage-backend contents ---"
          ls -laR coverage-backend/ 2>/dev/null || echo "(directory empty or missing)"
          echo "--- coverage-frontend contents ---"
          ls -laR coverage-frontend/ 2>/dev/null || echo "(directory empty or missing)"

          # Find backend coverage XML (may be nested in artifact dir)
          BACKEND_XML=$(find coverage-backend -name 'coverage.xml' -type f 2>/dev/null | head -1)
          FRONTEND_XML=$(find coverage-frontend -name 'cobertura-coverage.xml' -type f 2>/dev/null | head -1)
          BACKEND_XML="${BACKEND_XML:-coverage-backend/coverage.xml}"
          FRONTEND_XML="${FRONTEND_XML:-coverage-frontend/cobertura-coverage.xml}"
          echo "Backend XML: $BACKEND_XML"
          echo "Frontend XML: $FRONTEND_XML"

          # Create empty Cobertura XML if an artifact is missing
          EMPTY='<?xml version="1.0" ?>'
          EMPTY+='<coverage lines-valid="0" lines-covered="0" branches-valid="0" branches-covered="0" version="0.1">'
          EMPTY+='<packages></packages>'
          EMPTY+='</coverage>'

          if [ ! -f "$BACKEND_XML" ]; then
            echo "⚠️  Backend coverage artifact not found — using empty report."
            mkdir -p "$(dirname "$BACKEND_XML")"
            echo "$EMPTY" > "$BACKEND_XML"
          fi
          if [ ! -f "$FRONTEND_XML" ]; then
            echo "⚠️  Frontend coverage artifact not found — using empty report."
            mkdir -p "$(dirname "$FRONTEND_XML")"
            echo "$EMPTY" > "$FRONTEND_XML"
          fi

          python scripts/merge_coverage.py "$BACKEND_XML" "$FRONTEND_XML"

      - name: Post PR comment
        if: github.event_name == 'pull_request' && steps.merge.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage-comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ════════════════════════════════════════════════════════════
  # 7. Deploy (only on main, after all pass)
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, test-js, test-e2e, build-verify, coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/azad-e-school
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy — secrets not configured."
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/azad-e-school
            git pull origin main
            docker pull ghcr.io/${{ github.repository }}/azad-e-school:latest
            docker compose -f deploy/docker-compose.production.yml up -d --build
            docker compose -f deploy/docker-compose.production.yml exec -T app flask db upgrade
            docker compose -f deploy/docker-compose.production.yml exec -T app pybabel compile -d app/translations
            docker system prune -f

      - name: Smoke test
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          sleep 10
          curl -sf https://${{ secrets.DEPLOY_HOST }}/ || exit 1
